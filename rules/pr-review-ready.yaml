name: pr-review-ready
description: Review a draft pull request when it is marked ready for review.
owner: automation/pr-review
selector: github.pull_request.ready_for_review
where:
  - path: /data/draft
    equals: false
wake: false
reaction:
  capability:
    id: code.review
    version: 3
  input:
    repository:
      url: ${/data/repository/cloneUrl}
      ref: refs/pull/${/data/number}/head
    pullRequest: ${/data/number}
    budget:
      maxTokens: 200000
      maxMinutes: 20
  budget:
    maxTokens: 200000
    maxMinutes: 20
  maxDepth: 3
  maxFiringsPerHour: 20
