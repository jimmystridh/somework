name: qa-on-ticket
description: Verify a ticket in a browser when it enters the Test status. qa.verify writes to the ticket system, so every firing waits for approval.
owner: automation/qa-on-ticket
selector: jira.issue.transitioned
where:
  - path: /data/to
    equals: Test
wake: false
reaction:
  capability:
    id: qa.verify
    version: 1
  input:
    ticket: ${/data/issue/key}
    app: local
    repository:
      url: ${/data/repository/cloneUrl}
      ref: ${/data/repository/ref}
    budget:
      maxTokens: 800000
      maxMinutes: 60
  budget:
    maxTokens: 800000
    maxMinutes: 60
  maxDepth: 2
  maxFiringsPerHour: 10
