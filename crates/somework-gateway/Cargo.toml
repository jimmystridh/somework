[package]
name = "somework-gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
bytes = "1.12.1"
chrono = "0.4.45"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
hyper = { version = "1.11.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "service", "http1", "http2"] }
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rustls = "0.23.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
somework-core = { version = "0.1.0", path = "../somework-core" }
somework-domain = { version = "0.1.0", path = "../somework-domain" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-util = "0.7.19"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["add-extension"] }
tracing = "0.1.44"
urlencoding = "2.1.3"
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
