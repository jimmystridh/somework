syntax = "proto3";

package somework.v1;

import "google/protobuf/struct.proto";

// Identical domain semantics to the REST API (`docs/api.md`). Ids are typed; the JSON-Schema-defined payloads
// (capability input/output, envelope content) stay `google.protobuf.Struct` so the canonical v1 JSON contracts remain the
// single source of truth.
//
// Request metadata: `authorization: Bearer <assertion|OIDC token>`, `idempotency-key`, `traceparent`. Every response
// carries `trace-id` and `traceparent` metadata and a `trace_id` field.

message CapabilityRef {
  string id = 1;
  string version = 2;
}

message Member {
  string kind = 1; // agent | human | service | domain
  string id = 2;
}

// ---- CatalogService -----------------------------------------------------------------------------------------------------

message SearchConstraints {
  string side_effects_at_most = 1;
  string data_classification = 2;
  repeated string allowed_domains = 3;
}

message SearchRequest {
  string query = 1;
  repeated string required_capabilities = 2;
  repeated string tags = 3;
  google.protobuf.Struct input = 4;
  google.protobuf.Struct input_schema = 5;
  google.protobuf.Struct output_schema = 6;
  SearchConstraints constraints = 7;
  repeated string availability = 8;
  repeated string trust_tiers = 9;
  uint32 limit = 10;
}

message SearchMatch {
  string entry_id = 1;
  string agent_id = 2;
  string domain_id = 3;
  double score = 4;
  string availability = 5;
  repeated CapabilityRef matched_capabilities = 6;
  repeated string why = 7;
}

message SearchResponse {
  repeated SearchMatch matches = 1;
  string trace_id = 2;
}

message GetAgentRequest {
  string agent_id = 1;
}

message GetAgentResponse {
  string entry_id = 1;
  string agent_id = 2;
  google.protobuf.Struct entry = 3; // CatalogEntry (card filtered to what the caller may see)
  string trace_id = 4;
}

message GetCapabilityRequest {
  string id = 1;
  string version = 2;
}

message GetCapabilityResponse {
  google.protobuf.Struct capability = 1;
  string trace_id = 2;
}

service CatalogService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  rpc GetCapability(GetCapabilityRequest) returns (GetCapabilityResponse);
}

// ---- MessageService -----------------------------------------------------------------------------------------------------

message SendMessageRequest {
  string type = 1; // chat.message (default), chat.notice, event.notification
  string message_id = 2;
  string conversation_id = 3;
  reserved 4;
  repeated Member recipients = 5;
  string media_type = 6;
  google.protobuf.Value data = 7;
  string correlation_id = 8;
  string causation_id = 9;
  string reply_to = 10;
  string expires_at = 11;
  string priority = 12;
  string trigger_mode = 13; // never | directed | subscription
  repeated google.protobuf.Struct artifacts = 14;
  reserved 15;
  map<string, string> labels = 16;
  string idempotency_key = 17;
}

message MessageRecord {
  string message_id = 1;
  int64 seq = 2;
  string type = 3;
  string conversation_id = 4;
  string trigger_mode = 5;
  google.protobuf.Struct envelope = 6; // canonical MessageEnvelope
  string trace_id = 7;
}

message ListMessagesRequest {
  string conversation_id = 1;
  int64 cursor = 2;
  int64 limit = 3;
}

message ListMessagesResponse {
  repeated MessageRecord messages = 1;
  int64 next_cursor = 2;
  bool has_more = 3;
  string trace_id = 4;
}

service MessageService {
  rpc Send(SendMessageRequest) returns (MessageRecord);
  rpc List(ListMessagesRequest) returns (ListMessagesResponse);
}

// ---- EventService -------------------------------------------------------------------------------------------------------

message WatchEventsRequest {
  int64 after = 1; // cursor; 0 resumes from the caller's acknowledged cursor
  bool from_start = 2; // true: start at event 0 regardless of the stored cursor
  int64 limit = 3;
}

message Event {
  int64 seq = 1;
  string event_id = 2;
  string type = 3;
  reserved 4;
  string conversation_id = 5;
  string message_id = 6;
  reserved 7;
  bool wake = 8;
  google.protobuf.Struct payload = 9;
  string created_at = 10;
}

message AckEventsRequest {
  int64 cursor = 1;
}

message AckEventsResponse {
  int64 cursor = 1;
  string trace_id = 2;
}

message PublishEventRequest {
  string topic = 1;
  string key = 2; // stable per-producer key; a repeat within 30 days is a no-op
  string source = 3;
  google.protobuf.Struct data = 4;
  string classification = 5;
  optional bool verified = 6;
  reserved 7;
  string occurred_at = 8;
}

message PublishEventResponse {
  int64 seq = 1;
  string event_id = 2;
  bool duplicate = 3;
  string trace_id = 4;
}

service EventService {
  rpc Watch(WatchEventsRequest) returns (stream Event);
  rpc Ack(AckEventsRequest) returns (AckEventsResponse);
  rpc Publish(PublishEventRequest) returns (PublishEventResponse);
}

// ---- ArtifactService ----------------------------------------------------------------------------------------------------

message BeginUploadRequest {
  string artifact_id = 1;
  string filename = 2;
  string media_type = 3;
  uint64 size_bytes = 4;
  string sha256 = 5;
  string classification = 6;
  reserved 7;
  google.protobuf.Struct provenance = 8;
  string expires_at = 9;
  string conversation_id = 10;
}

message UploadGrant {
  string artifact_id = 1;
  uint64 version = 2;
  string uri = 3;
  string expires_at = 4;
  string method = 5;
  string url = 6;
  map<string, string> headers = 7;
  google.protobuf.Struct multipart = 8;
  string trace_id = 9;
}

message CompletedPart {
  uint32 part_number = 1;
  string etag = 2;
}

message CompleteUploadRequest {
  string artifact_id = 1;
  uint64 version = 2;
  repeated CompletedPart parts = 3;
}

message ArtifactMetadata {
  string artifact_id = 1;
  uint64 version = 2;
  string uri = 3;
  string media_type = 4;
  uint64 size_bytes = 5;
  string sha256 = 6;
  string classification = 7;
  google.protobuf.Struct artifact = 8; // canonical ArtifactRef
  string trace_id = 9;
}

message GetArtifactRequest {
  string artifact_id = 1;
  uint64 version = 2;
}

message GetDownloadRequest {
  string artifact_id = 1;
  uint64 version = 2;
}

message DownloadGrant {
  ArtifactMetadata artifact = 1;
  string url = 2;
  string expires_at = 3;
  string trace_id = 4;
}

service ArtifactService {
  rpc BeginUpload(BeginUploadRequest) returns (UploadGrant);
  rpc CompleteUpload(CompleteUploadRequest) returns (ArtifactMetadata);
  rpc GetMetadata(GetArtifactRequest) returns (ArtifactMetadata);
  rpc GetDownload(GetDownloadRequest) returns (DownloadGrant);
}

// ---- SubscriptionService -------------------------------------------------------------------------

message CreateSubscriptionRequest {
  string kind = 1; // topic | conversation
  string selector = 2;
  optional bool wake_on_match = 3; // required: no implicit wake behaviour (SUB-02)
}

message Subscription {
  string subscription_id = 1;
  string kind = 2;
  string selector = 3;
  bool wake_on_match = 4;
  string status = 5;
  string subject = 6;
  string trace_id = 7;
}

message DeleteSubscriptionRequest {
  string subscription_id = 1;
}

message DeleteSubscriptionResponse {
  string trace_id = 1;
}

service SubscriptionService {
  rpc Create(CreateSubscriptionRequest) returns (Subscription);
  rpc Delete(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse);
}
