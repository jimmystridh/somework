[package]
name = "somework-api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
futures = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
mime = "0.3.17"
parking_lot = "0.12.5"
prost = "0.14.4"
prost-types = "0.14.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
somework-core = { version = "0.1.0", path = "../somework-core" }
somework-domain = { version = "0.1.0", path = "../somework-domain" }
somework-gateway = { version = "0.1.0", path = "../somework-gateway" }
somework-matrix = { version = "0.1.0", path = "../somework-matrix" }
somework-nats = { version = "0.1.0", path = "../somework-nats" }
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
toml = "1.1.6"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
tonic-types = "0.14.6"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-gzip", "set-header", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
urlencoding = "2.1.3"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.151"
somework-client = { path = "../somework-client" }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }

[[bin]]
name = "somework"
path = "src/main.rs"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"
