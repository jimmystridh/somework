[package]
name = "somework-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3.6"
bytes = "1.12.1"
chrono = "0.4.45"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
somework-core = { version = "0.1.0", path = "../somework-core" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"
