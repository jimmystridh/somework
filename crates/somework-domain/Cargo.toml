[package]
name = "somework-domain"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
dashmap = "6.2.1"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
parking_lot = "0.12.5"
prometheus = "0.14.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
somework-core = { version = "0.1.0", path = "../somework-core" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = "2.5.8"
urlencoding = "2.1.3"
vodozemac = "0.11.1"

[dev-dependencies]
hex = "0.4.3"
proptest = "1.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
