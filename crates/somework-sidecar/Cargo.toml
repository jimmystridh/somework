[package]
name = "somework-sidecar"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-nats = "0.50.0"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
futures = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
somework-client = { version = "0.1.0", path = "../somework-client" }
somework-core = { version = "0.1.0", path = "../somework-core" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
urlencoding = "2.1.3"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }

[[bin]]
name = "somework-sidecar"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
