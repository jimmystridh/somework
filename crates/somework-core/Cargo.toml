[package]
name = "somework-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "pkcs8"] }
hex = "0.4.3"
jsonschema = { version = "0.58.5", default-features = false }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
ulid = "3.0.0"

[dev-dependencies]
proptest = "1.11.0"
