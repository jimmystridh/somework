[package]
name = "somework-matrix"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
chrono = "0.4.45"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
somework-core = { version = "0.1.0", path = "../somework-core" }
somework-domain = { version = "0.1.0", path = "../somework-domain" }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
parking_lot = "0.12"
hex = "0.4.3"
tokio-util = "0.7.19"
vodozemac = "0.11.1"
