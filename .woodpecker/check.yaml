when:
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: install
    # bun reads the npm lockfile (package-lock.json), installs the same 127 package versions, runs no lifecycle scripts and fails when the
    # lockfile is stale; later steps run on node because the tests and tools are written for it
    image: oven/bun@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895
    commands:
      - bun install --frozen-lockfile --ignore-scripts

  - name: boundaries
    image: node:22.19.0-bookworm
    commands:
      - npm run check:roles

  - name: unit-tests
    image: node:22.19.0-bookworm
    commands:
      - npm test --workspace packages/rules-cli
      - node --test sdk/typescript/test/events.test.ts sdk/typescript/test/identity.test.ts
      - npm test --workspace packages/events-receiver --workspace packages/events-hub --if-present

  - name: validate-rules
    image: node:22.19.0-bookworm
    commands:
      - node packages/rules-cli/src/main.ts validate --card adapters --strict --out plan.md

  - name: plan-rules
    image: node:22.19.0-bookworm
    when:
      - event: pull_request
    environment:
      SOMEWORK_URL:
        from_secret: somework_url
      SOMEWORK_RULES_KEY:
        from_secret: somework_rules_read_key
      SOMEWORK_CA:
        from_secret: somework_ca
    commands:
      - umask 077
      - printf '%s' "$SOMEWORK_RULES_KEY" > /tmp/rules.key.json
      - printf '%s' "$SOMEWORK_CA" > /tmp/ca.pem
      - export SOMEWORK_RULES_KEY_FILE=/tmp/rules.key.json SOMEWORK_CA_FILE=/tmp/ca.pem SOMEWORK_REQUIRE_TLS=1
      - node packages/rules-cli/src/main.ts plan --card adapters --out plan.md

  - name: comment-plan
    image: node:22.19.0-bookworm
    failure: ignore
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - test -f plan.md
      - node packages/rules-cli/src/main.ts comment --file plan.md --repo "$CI_REPO" --pr "$CI_COMMIT_PULL_REQUEST"
    when:
      - event: pull_request
        status: [success, failure]
