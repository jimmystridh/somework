# Pi agent on the agent Docker host (VM102): harness, sandbox and egress proxy, isolated from each other.
# - `sandbox-net` is internal: containers on it have no route out. The sandbox is only on it.
# - The egress proxy is the sandbox's single way out (host allowlist, private ranges refused).
# - The harness holds the credentials and talks to the sandbox over `sandbox-net`; it also reaches the domain and the model API.
name: somework-pi

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  privileged: false
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

networks:
  sandbox-net:
    internal: true
  outside: {}

services:
  agent:
    <<: *hardened
    image: somework-pi-agent:${PI_VERSION:?set PI_VERSION to the built image tag}
    user: "10001:10001"
    group_add: ["10010"]          # reads the shared sandbox token
    networks: [sandbox-net, outside]
    environment:
      SOMEWORK_URL: ${SOMEWORK_URL:?https URL of the domain proxy}
      SOMEWORK_KEY_FILE: /run/somework/keys/agent.key.json
      SOMEWORK_CA_FILE: /run/somework/ca.pem
      SOMEWORK_REQUIRE_TLS: "1"
      SOMEWORK_LEASE_SECONDS: ${SOMEWORK_LEASE_SECONDS:-60}
      PI_PROVIDER: ${PI_PROVIDER:-openai-codex}
      PI_MODEL: ${PI_MODEL:-gpt-5.5}
      PI_ALLOWED_MODELS: ${PI_ALLOWED_MODELS:-}
      PI_FAUX_PLAN: ${PI_FAUX_PLAN:-}
      PI_AUTH_FILE: /run/secrets/pi/auth.json
      PI_STATE_DIR: /state
      PI_CONCURRENCY: ${PI_CONCURRENCY:-2}
      SANDBOX_URL: http://sandbox:7070
      SANDBOX_TOKEN_FILE: /run/secrets/sandbox-token
      SANDBOX_WORKSPACES: /workspace
      AGENT_VERSION: ${PI_VERSION}                          # shown on /profile (the image tag this container runs)
      GIT_TOKEN_EXPIRES: ${GIT_TOKEN_EXPIRES:-}              # optional note for /profile: the token's expiry date, YYYY-MM-DD
      GIT_TOKEN_FILE: /run/secrets/git-token
      # A GitHub App instead of the token file (packages/agent-kit/README.md, "GitHub App identity"): remove GIT_TOKEN_FILE, mount the key, set these.
      # GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      # GITHUB_APP_KEY_FILE: /run/secrets/github-app.pem
      # GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GIT_PR_DRAFT: ${GIT_PR_DRAFT:-1}
      GIT_TOKEN_HOSTS: ${GIT_TOKEN_HOSTS:-github.com}   # the only hosts the git token may ever be sent to
      SKILLS_ALLOW: ${SKILLS_ALLOW:-}                   # repository skills this agent may use; empty = none
      SKILLS_OVERLAY_DIR: ${SKILLS_OVERLAY_DIR:-}
      BUDGET_MAX_TOKENS_CAP: ${BUDGET_MAX_TOKENS_CAP:-2000000}
      BUDGET_MAX_MINUTES_CAP: ${BUDGET_MAX_MINUTES_CAP:-60}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-10000000}
      EVENTS_ENABLED: ${EVENTS_ENABLED:-0}                  # 1 = run event handlers and wakes for this agent (docs/EVENTS.md)
      EVENTS_NOTIFY_TO: ${EVENTS_NOTIFY_TO:-agent/manager}
      EVENTS_CONTROLLERS: ${EVENTS_CONTROLLERS:-agent/manager}
      EVENTS_ACCEPT: ${EVENTS_ACCEPT:-}
      EVENTS_TOKEN_SHARE: ${EVENTS_TOKEN_SHARE:-0.3}
      EVENTS_THROTTLE_AT: ${EVENTS_THROTTLE_AT:-0.8}
      EVENTS_MAX_FAILURES: ${EVENTS_MAX_FAILURES:-5}
      EVENTS_MAX_WAKES_PER_HOUR: ${EVENTS_MAX_WAKES_PER_HOUR:-20}
      EVENTS_HANDLER_TIMEOUT_SECONDS: ${EVENTS_HANDLER_TIMEOUT_SECONDS:-10}
      EVENTS_WAKE_MAX_TOKENS: ${EVENTS_WAKE_MAX_TOKENS:-100000}
      CHAT_MODE: ${CHAT_MODE:-model}                         # model = chat is answered by the model (questions read-only, instructions as jobs); notice = the fixed notice only
      CHAT_ALLOWED_SENDERS: ${CHAT_ALLOWED_SENDERS:-}        # who may ask: ids or kind:<kind>; empty = agent/manager and every human
      CHAT_INSTRUCTORS: ${CHAT_INSTRUCTORS:-}                # who may instruct (messages starting with instruct:); empty = agent/manager
      CHAT_REPOSITORY_URL: ${CHAT_REPOSITORY_URL:-}          # the repository an instruction works on unless it says repo: (empty = it must say)
      CHAT_REPOSITORY_REF: ${CHAT_REPOSITORY_REF:-}
      CHAT_TOKEN_SHARE: ${CHAT_TOKEN_SHARE:-0.1}             # share of DAILY_TOKEN_LIMIT that chat may use; the model is not called when it is used up
      CHAT_TOKEN_CAP: ${CHAT_TOKEN_CAP:-40000}               # tokens of one answer to a question
      CHAT_INSTRUCT_TOKENS: ${CHAT_INSTRUCT_TOKENS:-150000}  # tokens of one instruction
      # Observe tools (read-only Grafana/Loki queries: logs_query, my_history, logs_labels, alerts_status, dashboards_search). Off unless enabled:
      # OBSERVE_ENABLED: "1"
      # OBSERVE_SCOPE: own                                   # own = only this agent's streams (OBSERVE_OWN=container="x"); fleet = the whole cluster's agent logs
      # GRAFANA_URL: https://grafana.example
      # GRAFANA_TOKEN_FILE: /run/secrets/grafana-token       # Viewer service account token, deploy/grafana/provision-reader.py; mount it below
      # GRAFANA_CA_FILE: /run/somework/grafana-ca.pem        # CA of the read-only Grafana route (the logging CA); mount it below
      # OBSERVE_OWN: 'container="<this agent's container name>"'   # required with the own scope
      CHAT_INSTRUCT_MINUTES: ${CHAT_INSTRUCT_MINUTES:-15}
      HEALTH_PORT: "8081"
    volumes:
      - ${AGENT_KEY_DIR:?directory holding agent.key.json (uid 10001, 0700)}:/run/somework/keys:ro
      - ./config/ca.pem:/run/somework/ca.pem:ro
      - ./secrets/pi:/run/secrets/pi                        # auth.json: rw because an OAuth refresh rewrites it
      - ./secrets/sandbox-token:/run/secrets/sandbox-token:ro
      - ./skills-overlay:/run/skills-overlay:ro               # <skill>.md overlays (only used with SKILLS_OVERLAY_DIR)
      - ./secrets/git-token:/run/secrets/git-token:ro       # fine-grained PAT, one repository: Contents + Pull requests write
      # - ./secrets/grafana-token:/run/secrets/grafana-token:ro
      # - ./config/grafana-ca.pem:/run/somework/grafana-ca.pem:ro
      - state:/state
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    ports: ["${HEALTH_BIND:-127.0.0.1}:8081:8081"]      # health, handlers and token pools; HEALTH_BIND is the VM address the dashboard reads (restrict it in DOCKER-USER)
    depends_on:
      sandbox: {condition: service_healthy}
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  sandbox:
    <<: *hardened
    image: somework-pi-sandbox:${PI_VERSION:?set PI_VERSION}
    user: "10002:10002"
    group_add: ["10010"]
    networks: [sandbox-net]
    environment:
      SANDBOX_TOKEN_FILE: /run/secrets/sandbox-token
      SANDBOX_ROOT: /workspace
      SANDBOX_PORT: "7070"
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: sandbox,localhost,127.0.0.1
    volumes:
      - ./secrets/sandbox-token:/run/secrets/sandbox-token:ro
      - workspace:/workspace
    tmpfs: ["/tmp:size=512m,nosuid"]
    mem_limit: ${SANDBOX_MEMORY:-3g}
    cpus: ${SANDBOX_CPUS:-1.5}
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7070/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  egress:
    <<: *hardened
    image: somework-pi-egress:${PI_VERSION:?set PI_VERSION}
    user: "10003:10003"
    networks: [sandbox-net, outside]
    environment:
      EGRESS_ALLOW: ${EGRESS_ALLOW:-github.com,*.github.com,*.githubusercontent.com,registry.npmjs.org,*.npmjs.org,registry.yarnpkg.com,bun.sh,pypi.org,files.pythonhosted.org,crates.io,static.crates.io,index.crates.io,docs.rs,api.nuget.org,*.nuget.org,repo.maven.apache.org,rubygems.org,proxy.golang.org,sum.golang.org,learn.microsoft.com,developer.mozilla.org,stackoverflow.com,*.stackexchange.com,en.wikipedia.org}
      EGRESS_PORTS: "443,80"
    mem_limit: 128m
    pids_limit: 64

  # One-shot: named volumes start root-owned but each service runs as its own uid.
  #   docker compose --profile init run --rm init-volumes
  init-volumes:
    image: somework-pi-agent:${PI_VERSION:?set PI_VERSION}
    profiles: ["init"]
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 10001:10001 /state && chown 10002:10002 /workspace"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - state:/state
      - workspace:/workspace

volumes:
  state:
  workspace:
