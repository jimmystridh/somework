# The Aikido fixer on the agent Docker host: the harness and a sandbox, isolated from each other, in their own compose project.
# - `sandbox-net` is internal: nothing on it has a route out except the egress proxy. The kit runs git and the model's commands through
#   the sandbox, so the sandbox needs the code host and the package registries the repository's code uses; the proxy admits only what
#   EGRESS_ALLOW lists, private ranges are always refused.
# - The harness holds the credentials: its OWN SomeWork key, its OWN model login, a code-host token that may push agent/* branches and open
#   pull requests on ONE repository, and the Aikido client file. It reaches the domain, the model API, the code host and Aikido over
#   `outside`. The git token is handed to a git command only while it runs (and only for GIT_TOKEN_HOSTS), never to the model's tools; the
#   Aikido credentials never leave the harness (the model reads Aikido through a tool that runs there).
# - The sandbox and egress images are the developer role's (`somework-pi-sandbox`, `somework-pi-egress`); only the harness image is this role's.
# - The persistent mirror of the repository lives in the sandbox's workspace volume (`/workspace/.mirrors`), so every fix starts from a
#   clone that is a few seconds old instead of a full download.
name: somework-aikido-fixer

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  privileged: false
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

networks:
  sandbox-net:
    internal: true
  outside: {}

services:
  agent:
    <<: *hardened
    image: somework-aikido-fixer:${FIXER_VERSION:?set FIXER_VERSION to the built image tag}
    user: "10001:10001"
    group_add: ["10010"]          # reads the shared sandbox token
    networks: [sandbox-net, outside]
    environment:
      SOMEWORK_URL: ${SOMEWORK_URL:?https URL of the domain proxy}
      SOMEWORK_KEY_FILE: /run/somework/keys/agent.key.json
      SOMEWORK_CA_FILE: /run/somework/ca.pem
      SOMEWORK_REQUIRE_TLS: "1"
      SOMEWORK_LEASE_SECONDS: ${SOMEWORK_LEASE_SECONDS:-60}
      PI_PROVIDER: ${PI_PROVIDER:-openai-codex}
      PI_MODEL: ${PI_MODEL:-gpt-5.5}
      PI_ALLOWED_MODELS: ${PI_ALLOWED_MODELS:-}
      PI_FAUX_PLAN: ${PI_FAUX_PLAN:-}
      PI_AUTH_FILE: /run/secrets/pi/auth.json
      PI_STATE_DIR: /state
      PI_CONCURRENCY: "1"                                    # one fix at a time: the role refuses to start otherwise
      SANDBOX_URL: http://sandbox:7070
      SANDBOX_TOKEN_FILE: /run/secrets/sandbox-token
      SANDBOX_WORKSPACES: /workspace
      AGENT_VERSION: ${FIXER_VERSION}                          # shown on /profile (the image tag this container runs)
      GIT_TOKEN_EXPIRES: ${GIT_TOKEN_EXPIRES:-}              # optional note for /profile: the token's expiry date, YYYY-MM-DD
      GIT_TOKEN_FILE: /run/secrets/git-token                # fine-grained, ONE repository: Contents + Pull requests write
      # A GitHub App instead of the token file (packages/agent-kit/README.md, "GitHub App identity"): remove GIT_TOKEN_FILE, mount the key, set these.
      # GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      # GITHUB_APP_KEY_FILE: /run/secrets/github-app.pem
      # GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GIT_TOKEN_HOSTS: ${GIT_TOKEN_HOSTS:-github.com}       # the only hosts the token may ever be sent to
      GITHUB_API: ${GITHUB_API:-}                           # only for a GitHub Enterprise API
      GIT_PR_DRAFT: ${GIT_PR_DRAFT:-0}                      # 0 = real pull requests (default), 1 = drafts; either way only agent/* branches, never merged
      GIT_MIRROR_DIR: /workspace/.mirrors                   # inside the sandbox
      AIKIDO_MIRROR_REFRESH_MINUTES: ${AIKIDO_MIRROR_REFRESH_MINUTES:-30}
      AIKIDO_REPOSITORY_URL: ${AIKIDO_REPOSITORY_URL:?clone URL of the one repository this agent fixes}
      AIKIDO_REGION: ${AIKIDO_REGION:-eu}                   # eu | us | me
      AIKIDO_CLIENT_FILE: /run/secrets/aikido-client.json
      AIKIDO_MIN_SEVERITY: ${AIKIDO_MIN_SEVERITY:-high}     # low | medium | high | critical
      AIKIDO_FIX_TYPES: ${AIKIDO_FIX_TYPES:-open_source,sast,iac}
      AIKIDO_MAX_FILES: ${AIKIDO_MAX_FILES:-40}
      AIKIDO_PROTECTED_PATHS: ${AIKIDO_PROTECTED_PATHS:-}    # empty = the built-in list (workflows, pipelines, code owners, keys, env files)
      AIKIDO_CHECK_PROFILE: ${AIKIDO_CHECK_PROFILE:-}        # name of a profile in the checks file; empty = no check run by the service
      AIKIDO_CHECK_FILE: /run/config/checks.json
      AIKIDO_MAX_ATTEMPTS_PER_ISSUE: ${AIKIDO_MAX_ATTEMPTS_PER_ISSUE:-2}
      AIKIDO_ATTEMPT_COOLDOWN_MINUTES: ${AIKIDO_ATTEMPT_COOLDOWN_MINUTES:-180}
      AIKIDO_DAILY_CAP: ${AIKIDO_DAILY_CAP:-5}
      AIKIDO_FIX_BUDGET_TOKENS: ${AIKIDO_FIX_BUDGET_TOKENS:-300000}
      AIKIDO_FIX_BUDGET_MINUTES: ${AIKIDO_FIX_BUDGET_MINUTES:-30}
      AIKIDO_LEDGER_IMPORT: ${AIKIDO_LEDGER_IMPORT:-}         # a JSON file of earlier attempts (mount it under /run/config), imported once and idempotently; see the README
      AIKIDO_RESEED_HANDLER: ${AIKIDO_RESEED_HANDLER:-0}     # 1 = write the shipped handler again, with these settings, as a new version
      BUDGET_MAX_TOKENS_CAP: ${BUDGET_MAX_TOKENS_CAP:-500000}
      BUDGET_MAX_MINUTES_CAP: ${BUDGET_MAX_MINUTES_CAP:-45}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-2000000}
      EVENTS_ENABLED: "1"                                    # the shipped handler is how events become fix tasks (docs/EVENTS.md)
      EVENTS_NOTIFY_TO: ${EVENTS_NOTIFY_TO:-agent/manager}
      EVENTS_CONTROLLERS: ${EVENTS_CONTROLLERS:-agent/manager}
      EVENTS_TOKEN_SHARE: ${EVENTS_TOKEN_SHARE:-0.3}
      EVENTS_THROTTLE_AT: ${EVENTS_THROTTLE_AT:-0.8}
      EVENTS_MAX_FAILURES: ${EVENTS_MAX_FAILURES:-5}
      EVENTS_MAX_WAKES_PER_HOUR: ${EVENTS_MAX_WAKES_PER_HOUR:-20}
      CHAT_MODE: ${CHAT_MODE:-model}                         # model = chat is answered by the model (questions read-only, instructions as jobs); notice = the fixed notice only
      CHAT_ALLOWED_SENDERS: ${CHAT_ALLOWED_SENDERS:-}        # who may ask: ids or kind:<kind>; empty = agent/manager and every human
      CHAT_INSTRUCTORS: ${CHAT_INSTRUCTORS:-}                # who may instruct (messages starting with instruct:); empty = agent/manager
      CHAT_TOKEN_SHARE: ${CHAT_TOKEN_SHARE:-0.1}             # share of DAILY_TOKEN_LIMIT that chat may use; the model is not called when it is used up
      CHAT_TOKEN_CAP: ${CHAT_TOKEN_CAP:-40000}               # tokens of one answer to a question
      CHAT_INSTRUCT_TOKENS: ${CHAT_INSTRUCT_TOKENS:-150000}  # tokens of one instruction
      # Observe tools (read-only Grafana/Loki queries: logs_query, my_history, logs_labels, alerts_status, dashboards_search). Off unless enabled:
      # OBSERVE_ENABLED: "1"
      # OBSERVE_SCOPE: own                                   # own = only this agent's streams (OBSERVE_OWN=container="x"); fleet = the whole cluster's agent logs
      # GRAFANA_URL: https://grafana.example
      # GRAFANA_TOKEN_FILE: /run/secrets/grafana-token       # Viewer service account token, deploy/grafana/provision-reader.py; mount it below
      # GRAFANA_CA_FILE: /run/somework/grafana-ca.pem        # CA of the read-only Grafana route (the logging CA); mount it below
      # OBSERVE_OWN: 'container="<this agent's container name>"'   # required with the own scope
      CHAT_INSTRUCT_MINUTES: ${CHAT_INSTRUCT_MINUTES:-15}
      HEALTH_PORT: "8081"
    volumes:
      - ${FIXER_KEY_DIR:?directory holding agent.key.json (uid 10001, 0700)}:/run/somework/keys:ro
      - ./config/ca.pem:/run/somework/ca.pem:ro
      - ./config/checks.json:/run/config/checks.json:ro      # named check profiles of the repository (see checks.example.json); an empty {} file is fine without one
      # - ./config/ledger-import.json:/run/config/ledger-import.json:ro    # earlier attempts (AIKIDO_LEDGER_IMPORT=/run/config/ledger-import.json); create the file first or Docker makes a directory of it
      - ./secrets/pi:/run/secrets/pi                         # auth.json: rw because an OAuth refresh rewrites it. THIS role's own login.
      - ./secrets/sandbox-token:/run/secrets/sandbox-token:ro
      - ./secrets/git-token:/run/secrets/git-token:ro        # fine-grained, ONE repository, Contents + Pull requests: write
      # - ./secrets/grafana-token:/run/secrets/grafana-token:ro
      # - ./config/grafana-ca.pem:/run/somework/grafana-ca.pem:ro
      - ./secrets/aikido-client.json:/run/secrets/aikido-client.json:ro   # {"clientId": "...", "clientSecret": "..."}; read-only access to issues
      - state:/state
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    ports: ["${HEALTH_BIND:-127.0.0.1}:8083:8081"]      # health, handlers and token pools (8081 is the developer agent, 8082 the reviewer, on the same host)
    depends_on:
      sandbox: {condition: service_healthy}
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  sandbox:
    <<: *hardened
    image: somework-pi-sandbox:${SANDBOX_VERSION:?set SANDBOX_VERSION to the developer role's sandbox image tag}
    user: "10002:10002"
    group_add: ["10010"]
    networks: [sandbox-net]
    environment:
      SANDBOX_TOKEN_FILE: /run/secrets/sandbox-token
      SANDBOX_ROOT: /workspace
      SANDBOX_PORT: "7070"
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: sandbox,localhost,127.0.0.1
    volumes:
      - ./secrets/sandbox-token:/run/secrets/sandbox-token:ro
      - workspace:/workspace
    tmpfs: ["/tmp:size=512m,nosuid"]
    mem_limit: ${SANDBOX_MEMORY:-3g}
    cpus: ${SANDBOX_CPUS:-2}
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7070/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  # The sandbox's way out: the code host and the package registries of the repository's code, nothing else.
  egress:
    <<: *hardened
    image: somework-pi-egress:${SANDBOX_VERSION:?set SANDBOX_VERSION}
    user: "10003:10003"
    networks: [sandbox-net, outside]
    environment:
      EGRESS_ALLOW: ${EGRESS_ALLOW:-github.com,*.github.com,*.githubusercontent.com,registry.npmjs.org,*.npmjs.org,registry.yarnpkg.com,api.nuget.org,*.nuget.org,pypi.org,files.pythonhosted.org,crates.io,static.crates.io,index.crates.io,repo.maven.apache.org,rubygems.org,proxy.golang.org,sum.golang.org,osv.dev,api.osv.dev,nvd.nist.gov,services.nvd.nist.gov,www.cve.org,learn.microsoft.com,developer.mozilla.org,stackoverflow.com}
      EGRESS_PORTS: "443,80"
    mem_limit: 128m
    pids_limit: 64

  # One-shot: named volumes start root-owned but each service runs as its own uid.
  #   docker compose --profile init run --rm init-volumes
  init-volumes:
    image: somework-aikido-fixer:${FIXER_VERSION:?set FIXER_VERSION}
    profiles: ["init"]
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 10001:10001 /state && chown 10002:10002 /workspace"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - state:/state
      - workspace:/workspace

volumes:
  state:
  workspace:
