# CANDIDATE ONLY: review required before use. Single node has no redundancy.
metadata_dir = "/data/meta"
data_dir = "/data/objects"
db_engine = "lmdb"
replication_factor = 1
metadata_fsync = true
metadata_auto_snapshot_interval = "6h"
data_fsync = true
block_ram_buffer_max = "128MiB"
rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/run/secrets/garage_rpc"
[s3_api]
api_bind_addr = "0.0.0.0:9000"
s3_region = "garage"
# No website listener or HTTP admin API. Provision through loopback RPC CLI.
