server {
    listen 10.10.10.13:9443 ssl;
    server_name admin-cloud-observability;
    ssl_certificate /etc/agent-cluster-observability/ingest.crt;
    ssl_certificate_key /etc/agent-cluster-observability/ingest.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    access_log /var/log/nginx/agent-cluster-ingest-access.log;
    error_log /var/log/nginx/agent-cluster-ingest-error.log;
    location = /loki/api/v1/push {
        limit_except POST { deny all; }
        auth_basic "Agent cluster log ingestion";
        auth_basic_user_file /etc/agent-cluster-observability/ingest.htpasswd;
        proxy_pass http://127.0.0.1:3100;
        proxy_read_timeout 60s;
    }
    location = /api/v1/write {
        limit_except POST { deny all; }
        auth_basic "Agent cluster metrics ingestion";
        auth_basic_user_file /etc/agent-cluster-observability/ingest.htpasswd;
        proxy_pass http://127.0.0.1:9090;
        proxy_read_timeout 60s;
    }
    location / { return 403; }
}
