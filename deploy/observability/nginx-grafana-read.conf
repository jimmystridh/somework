# Read-only Grafana for the agents' observe tools: GET of four API shapes (Loki queries, the Prometheus queries, the alert rules and the dashboard search), from the agents VM only (ufw), with the service account token.
server {
    listen 10.10.10.13:9444 ssl;
    server_name admin-cloud-observability;
    ssl_certificate /etc/agent-cluster-observability/ingest.crt;
    ssl_certificate_key /etc/agent-cluster-observability/ingest.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/agent-cluster-grafana-read-access.log;
    error_log /var/log/nginx/agent-cluster-grafana-read-error.log;
    proxy_set_header X-WEBAUTH-USER "";
    proxy_set_header Tailscale-User-Login "";
    proxy_set_header Cookie "";
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    location ~ ^/api/datasources/proxy/uid/cluster-loki/loki/api/v1/(query_range|query|labels|label/[^/]+/values|series)$ { limit_except GET { deny all; } proxy_pass http://127.0.0.1:3000; }
    location ~ ^/api/datasources/proxy/uid/cluster-prometheus/api/v1/(query_range|query|series|metadata|labels|label/[^/]+/values)$ { limit_except GET { deny all; } proxy_pass http://127.0.0.1:3000; }
    location = /api/prometheus/grafana/api/v1/rules { limit_except GET { deny all; } proxy_pass http://127.0.0.1:3000; }
    location = /api/search { limit_except GET { deny all; } proxy_pass http://127.0.0.1:3000; }
    location / { return 403; }
}
