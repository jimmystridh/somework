# Woodpecker CI web UI, owner-only through Tailscale Serve (https port 8444 -> 127.0.0.1:8081)
server {
    listen 127.0.0.1:8081;
    server_name _;
    if ($http_tailscale_user_login != "${OWNER_LOGIN}") { return 403; }
    client_max_body_size 1m;
    location / {
        proxy_set_header Tailscale-User-Login "";
        proxy_set_header X-WEBAUTH-USER "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name ${SERVER_NAME};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate ${INTERNAL_CA};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass https://${SERVER_IP}:9445;
    }
}
