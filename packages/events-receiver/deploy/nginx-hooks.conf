# Server block for the webhook host, inside the origin's nginx (the one Penpot uses). Replace the variables when installing it:
#   HOOKS_HOST       the new Cloudflare host, one label under the zone so Universal SSL covers it (for example hooks-innov.example.net)
#   HOOKS_CERT_DIR   where the Cloudflare Origin CA certificate for that host lives in the nginx container
# Cloudflare side (Strict TLS rule for this host, proxied A record, Authenticated Origin Pulls) is in the README.
server {
    listen 443 ssl;
    server_name ${HOOKS_HOST};

    ssl_certificate         ${HOOKS_CERT_DIR}/hooks.pem;      # installed with hooks-install-origin-cert (next to this file)
    ssl_certificate_key     ${HOOKS_CERT_DIR}/hooks.key;
    ssl_protocols           TLSv1.2 TLSv1.3;

    # Authenticated Origin Pulls: only requests that went through OUR Cloudflare zone present this client certificate. The firewall allow-list
    # of Cloudflare ranges alone does not prove that, because those ranges are shared by every Cloudflare customer.
    ssl_client_certificate  ${HOOKS_CERT_DIR}/origin-pull-ca.pem;
    ssl_verify_client       on;

    # the origin container has a read-only root: logs go to the container's output (shipped like the others); neither names the request line
    access_log /dev/stdout hooks;
    error_log  /dev/stderr crit;

    client_max_body_size    1m;
    client_body_timeout     15s;
    client_header_timeout   15s;
    proxy_request_buffering on;

    location /hook/ {
        limit_req zone=hooks burst=60 nodelay;
        limit_req_status 429;
        # resolved at request time so a recreated receiver container (new address) is found without reloading nginx
        resolver                127.0.0.11 valid=10s ipv6=off;
        set                     $receiver http://events-receiver:8080;
        proxy_pass              $receiver;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        Connection "";
        proxy_set_header        CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header        X-Forwarded-For "";
        proxy_connect_timeout   3s;
        proxy_read_timeout      20s;
    }

    location / {
        return 404;
    }
}
