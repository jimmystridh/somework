# Goes into the http {} context of the origin's nginx (include it once).
# The request line of a webhook contains the source's secret token and, for some senders, a credential in the query: the access log of the hooks
# host therefore names neither, and its error log is limited to critical messages (nginx prints the request line in the others).
log_format hooks '$time_iso8601 $remote_addr cf=$http_cf_connecting_ip $request_method $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=hooks:10m rate=30r/s;
