# Slack app manifest for one SomeWork agent (packages/agent-kit/README.md, "Slack"). Create one app per agent: api.slack.com/apps -> Create New App ->
# From a manifest, and paste this in (YAML tab). Change the two names.
display_information:
  name: SomeWork QA agent
  description: A SomeWork agent. Write to it in a DM, or mention it in an allowed channel.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: somework-qa
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - im:read
      - im:write
      - app_mentions:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
