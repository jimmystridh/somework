[workspace]
members = ["shared", "server", "ui"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
fleet-shared = { path = "shared" }

[profile.release]
lto = "thin"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
