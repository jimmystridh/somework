# TLS and SCRAM only. Nothing in plain text, nothing without a password.
# TYPE      DATABASE    USER        ADDRESS            METHOD
# inside the container: the postgres OS user (backups, restores) over the socket
local       all         postgres                       peer
local       all         all                            reject
# Operations connects over TLS from the private network; narrow the address to the services VM (for example 10.10.10.12/32)
hostssl     operations  operations  10.10.10.0/24      scram-sha-256
hostnossl   all         all         0.0.0.0/0          reject
host        all         all         0.0.0.0/0          reject
